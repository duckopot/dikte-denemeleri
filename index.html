<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Dikte – tarayıcıda Whisper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Dikte</h1>
    <select id="lang" aria-label="Dil">
      <option value="turkish" selected>Türkçe</option>
      <option value="english">English</option>
    </select>
  </header>

  <section id="modelBox">
    <label for="model" class="muted">Model seç (ilk açılışta bir kez iner):</label>
    <select id="model" aria-label="Model"></select>
    <p id="modelInfo">Tamamen bu cihazda çalışır. Ses hiçbir yere gönderilmez.</p>
    <button id="loadBtn" class="secondary">Modeli indir ve yükle</button>
    <div id="progWrap" hidden>
      <div class="bar"><div id="bar"></div></div>
      <div id="progText">0%</div>
    </div>
    <p id="status" class="muted"></p>
    <p id="last" class="muted warn" hidden></p>
  </section>

  <div id="preview" class="preview" aria-live="polite"></div>
  <textarea id="out" placeholder="Konuştukça yazı burada belirir…" spellcheck="false"></textarea>

  <div class="row">
    <button id="mic" class="mic" disabled aria-label="Kaydı başlat/durdur">
      <svg viewBox="0 0 24 24" width="44" height="44"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z"/></svg>
    </button>
  </div>
  <label class="muted center live"><input type="checkbox" id="live" checked> Konuşurken geçici önizleme göster (son metin kayıt bitince tüm kayıttan çıkar)</label>
  <p id="micHint" class="muted center">Önce modeli yükle</p>

  <div class="row gap">
    <label class="btn secondary" id="fileLbl">Ses dosyası yükle
      <input id="file" type="file" accept="audio/*,video/*" hidden disabled>
    </label>
    <button id="copy" class="secondary">Kopyala</button>
    <button id="clear" class="secondary">Temizle</button>
  </div>
  <p class="center"><a href="#" id="wipeLink" class="muted" onclick="document.getElementById('wipe').click();return false">Seçili modeli sil</a> · <a href="#" id="wipeAllLink" class="muted" onclick="document.getElementById('wipeAll').click();return false">Hepsini sil</a><button id="wipeAll" hidden></button><button id="wipe" hidden></button></p>

  <footer class="muted center">
    Sunucu yok, takip yok. Model ilk açılışta huggingface.co'dan bir kez iner, sonra çevrimdışı çalışır.
    <br><span id="envInfo"></span>
  </footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
